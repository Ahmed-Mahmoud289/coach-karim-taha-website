.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.1) 30%,var(--bg))}
.hero .w{position:absolute;inset:auto 0 14px;z-index:1}
.hero small{color:var(--red);font-weight:700}
h1{text-shadow:0 2px 14px #000;margin:0;font-size:clamp(38px,11vw,56px);font-weight:800;line-height:1.15}
.lead{text-shadow:0 2px 10px #000;color:#c8c8cf;margin:4px 0 0;max-width:60%}
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.st div{background:var(--card);border-radius:12px;padding:12px;text-align:center;border-top:3px solid var(--red)}
.st b{display:block;font-size:30px;font-weight:800}
.st span{color:var(--mu);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:18px 16px;margin:14px 0}
.card h2{margin:0 0 14px;font-size:22px;font-weight:800}
label.l{display:block;font-weight:700;margin:14px 0 8px}
.req{color:var(--red)}
input[type=text],textarea{width:100%;font:inherit;color:var(--tx);background:#0f0f12;border:2px solid var(--line);border-radius:10px;padding:12px;min-height:50px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{border-color:var(--red);outline:0}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}
.stars button{background:none;border:0;font-size:38px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--gold)}
.cnt{color:var(--mu);font-size:13px;margin-top:4px}
.cons{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.cons input{width:24px;height:24px;margin-top:3px;accent-color:var(--red);flex:none}
.go{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--red);color:#fff;font:800 18px Tajawal,sans-serif;cursor:pointer}
.go:disabled{opacity:.6}
#msg{min-height:26px;margin:10px 0 0;text-align:center;color:var(--mu)}
#msg.e{color:#ff8b85}#msg.ok{color:#2fbf71}
.rv{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border-right:4px solid var(--red)}
.rh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.av{width:44px;height:44px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.rn{font-weight:800}.rd{color:var(--mu);font-size:13px}
.rs{color:var(--gold);letter-spacing:2px;margin-inline-start:auto;direction:ltr}
.rt{margin:0;white-space:pre-wrap;word-break:break-word}
.demo{background:#2a1a00;border:1px solid #6b4500;color:#ffcf7a;border-radius:10px;padding:10px 12px;font-size:14px;margin:12px 0}
.empty{text-align:center;color:var(--mu);padding:26px 0}
.hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
footer{text-align:center;color:var(--mu);padding:20px 0 40px;font-size:14px}
</style></head><body>
<header class="hero"><div class="w"><small>Captain Karim Taha</small><h1>آراء العملاء</h1><p class="lead">شاركنا تجربتك في التدريب مع الكابتن كريم طه.</p></div></header>
<main class="w">
<div class="st"><div><b id="n">0</b><span>عدد التقييمات</span></div><div><b id="avg">-</b><span>متوسط التقييم</span></div></div>
<div class="demo" id="demo" hidden>وضع تجريبي: التقييمات تُحفظ على هذا الجهاز فقط ولا يراها أحد غيرك.</div>
<section class="card"><h2>اكتب تقييمك</h2>
<label class="l" for="nm">الاسم <span class="req">*</span></label><input type="text" id="nm" maxlength="40" autocomplete="name">
<div class="l">التقييم</div><div class="stars" id="stars"></div>
<label class="l" for="tx">كيف كانت تجربتك في التدريب؟ وما رأيك في الحصة التدريبية؟ <span class="req">*</span></label><textarea id="tx" maxlength="600"></textarea><div class="cnt" dir="ltr" style="text-align:end"><span id="c">0</span> / 600</div>
<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="cons"><input type="checkbox" id="cs"><span>أوافق على نشر اسمي وتقييمي في هذه الصفحة.</span></label>
<button class="go" id="go" type="button">نشر التقييم</button><p id="msg"></p></section>
<h2 style="font-size:22px;font-weight:800;margin:24px 0 12px">تقييمات العملاء</h2><div id="list"></div></main>
<footer>كابتن كريم طه | مدرب شخصي</footer>
<script>
var API="",MODERATED=false,KEY="kt-reviews-local",rate=0,items=[];
function $(i){return document.getElementById(i)}
function say(t,c){var m=$("msg");m.textContent=t;m.className=c||""}
var st=$("stars");for(var i=1;i<=5;i++){var b=document.createElement("button");b.type="button";b.textContent="\u2605";b.setAttribute("aria-label",i+" من 5");b.dataset.v=i;st.appendChild(b)}
st.onclick=function(e){var v=+e.target.dataset.v;if(!v)return;rate=rate==v?0:v;[].forEach.call(st.children,function(b){b.classList.toggle("on",+b.dataset.v<=rate)})};
$("tx").oninput=function(){$("c").textContent=this.value.length};
function stars(n){return n?"\u2605".repeat(n)+"\u2606".repeat(5-n):""}
function render(){var l=$("list");l.textContent="";
if(!items.length){var e=document.createElement("div");e.className="empty";e.textContent="لا توجد تقييمات بعد. كن أول من يكتب تقييماً.";l.appendChild(e)}
items.forEach(function(r){var d=document.createElement("article");d.className="rv";
var h=document.createElement("div");h.className="rh";var a=document.createElement("div");a.className="av";a.textContent=(r.n||"?").trim().charAt(0);
var m=document.createElement("div"),nn=document.createElement("div"),dd=document.createElement("div");nn.className="rn";nn.textContent=r.n;dd.className="rd";
try{dd.textContent=new Date(r.t).toLocaleDateString("ar-EG",{year:"numeric",month:"long",day:"numeric"})}catch(x){}
m.appendChild(nn);m.appendChild(dd);h.appendChild(a);h.appendChild(m);
if(+r.s){var s=document.createElement("div");s.className="rs";s.textContent=stars(+r.s);h.appendChild(s)}
var p=document.createElement("p");p.className="rt";p.textContent=r.r;d.appendChild(h);d.appendChild(p);l.appendChild(d)});
$("n").textContent=items.length;var rs=items.filter(function(r){return +r.s>0});
$("avg").textContent=rs.length?(rs.reduce(function(a,r){return a+ +r.s},0)/rs.length).toFixed(1):"-"}
function load(){
if(!API){$("demo").hidden=false;try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){items=[]}render();return}
fetch(API).then(function(r){return r.json()}).then(function(j){items=Array.isArray(j)?j:[];render()}).catch(function(){render();say("تعذّر تحميل التقييمات الآن. حاول لاحقاً.","e")})}
$("go").onclick=function(){
var n=$("nm").value.trim(),t=$("tx").value.trim();
if(!n){say("اكتب اسمك أولاً.","e");return}
if(t.length<5){say("اكتب رأيك في التدريب.","e");return}
if(!$("cs").checked){say("يرجى الموافقة على نشر اسمك وتقييمك.","e");return}
if($("hp").value)return;
var last=0;try{last=+localStorage.getItem("kt-last")||0}catch(e){}
if(Date.now()-last<60000){say("انتظر دقيقة قبل إرسال تقييم آخر.","e");return}
var rv={t:new Date().toISOString(),n:n,s:rate,r:t},btn=this;btn.disabled=true;say("جارٍ الإرسال...");
function done(){try{localStorage.setItem("kt-last",Date.now())}catch(e){}
$("nm").value="";$("tx").value="";$("c").textContent=0;$("cs").checked=false;rate=0;[].forEach.call(st.children,function(b){b.classList.remove("on")});
if(!MODERATED){items.unshift(rv);render()}say(MODERATED?"شكراً لك! سيظهر تقييمك بعد المراجعة.":"شكراً لك! تم نشر تقييمك.","ok");btn.disabled=false}
if(!API){try{var a=JSON.parse(localStorage.getItem(KEY)||"[]");a.unshift(rv);localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}done();return}
fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({n:n,s:rate,r:t,hp:""})}).then(done).catch(function(){say("تعذّر الإرسال. تحقق من الاتصال وحاول مرة أخرى.","e");btn.disabled=false})};
load();
</script><style>.homefab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));inset-inline-start:14px;z-index:20;width:48px;height:48px;border-radius:50%;background:#e10600;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}@media print{.homefab{display:none}}</style><a class="homefab" href="/" aria-label="Home"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z"/></svg></a>
</body></html>
